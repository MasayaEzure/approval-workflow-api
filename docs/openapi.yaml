openapi: 3.0.3
info:
  title: 申請・承認ワークフロー API
  description: |
    申請の作成・提出・承認・却下を管理するワークフロー API。

    ## 状態遷移
    - DRAFT -> SUBMITTED（申請提出）
    - SUBMITTED -> APPROVED（承認）
    - SUBMITTED -> REJECTED（却下）

    上記以外の遷移は業務例外（INVALID_STATE）となる。

    ## 認証
    現在の実装では認証機構は未導入。
    操作者の識別はリクエストボディの ID フィールドで行う（学習用途のため簡略化）。
  version: 1.0.0

servers:
  - url: http://localhost:8080/api
    description: ローカル開発環境

tags:
  - name: 申請
    description: 申請の作成・提出・承認・却下・取得

paths:
  /requests:
    post:
      tags: [申請]
      summary: 申請を作成する（DRAFT 状態）
      operationId: createRequest
      description: |
        新しい申請を下書き（DRAFT）状態で作成する。
        作成後、Location ヘッダに作成された申請の URI が返却される。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestCreateBody"
            example:
              title: "経費精算申請"
              requesterId: 1
      responses:
        "201":
          description: 作成成功
          headers:
            Location:
              description: 作成された申請の URI
              schema:
                type: string
                example: /api/requests/1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestResponse"
              example:
                id: 1
                status: DRAFT
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    get:
      tags: [申請]
      summary: 申請一覧を取得する
      operationId: listRequests
      description: |
        全申請の一覧を取得する。
        ページネーションは未実装。全件を配列で返却する。
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequestResponse"
              example:
                - id: 1
                  status: DRAFT
                - id: 2
                  status: SUBMITTED
        "500":
          $ref: "#/components/responses/InternalServerError"

  /requests/{id}:
    get:
      tags: [申請]
      summary: 申請詳細を取得する
      operationId: getRequest
      description: |
        指定された ID の申請を取得する。
        現在の実装では id と status のみ返却する。
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestResponse"
              example:
                id: 1
                status: SUBMITTED
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /requests/{id}/submit:
    post:
      tags: [申請]
      summary: 申請を提出する（DRAFT -> SUBMITTED）
      operationId: submitRequest
      description: |
        下書き（DRAFT）状態の申請を提出（SUBMITTED）する。

        制約:
        - 申請者本人のみが提出可能（actorId と申請の requesterId が一致すること）
        - 申請の状態が DRAFT であること
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRequestBody"
            example:
              actorId: 1
      responses:
        "200":
          description: 提出成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestResponse"
              example:
                id: 1
                status: SUBMITTED
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /requests/{id}/approve:
    post:
      tags: [申請]
      summary: 申請を承認する（SUBMITTED -> APPROVED）
      operationId: approveRequest
      description: |
        提出済み（SUBMITTED）の申請を承認（APPROVED）する。

        制約:
        - APPROVER ロールを持つユーザーのみが実行可能
        - 申請の状態が SUBMITTED であること
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequestBody"
            example:
              approverId: 2
              comment: "承認します"
      responses:
        "200":
          description: 承認成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestResponse"
              example:
                id: 1
                status: APPROVED
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /requests/{id}/reject:
    post:
      tags: [申請]
      summary: 申請を却下する（SUBMITTED -> REJECTED）
      operationId: rejectRequest
      description: |
        提出済み（SUBMITTED）の申請を却下（REJECTED）する。

        制約:
        - APPROVER ロールを持つユーザーのみが実行可能
        - 申請の状態が SUBMITTED であること
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequestBody"
            example:
              approverId: 2
              comment: "内容に不備があります"
      responses:
        "200":
          description: 却下成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestResponse"
              example:
                id: 1
                status: REJECTED
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    RequestId:
      name: id
      in: path
      required: true
      description: 申請 ID
      schema:
        type: integer
        format: int64
      example: 1

  responses:
    BadRequest:
      description: リクエスト不正（バリデーションエラー等）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: "BAD_REQUEST"
            message: "タイトルは必須です"
            timestamp: "2026-01-01T00:00:00Z"
            path: "/api/requests"

    Forbidden:
      description: 権限不足
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: "FORBIDDEN"
            message: "承認はAPPROVERロールのユーザーのみが実行できます"
            timestamp: "2026-01-01T00:00:00Z"
            path: "/api/requests/1/approve"

    NotFound:
      description: リソースが見つからない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: "NOT_FOUND"
            message: "申請が見つかりません: 999"
            timestamp: "2026-01-01T00:00:00Z"
            path: "/api/requests/999"

    Conflict:
      description: 状態遷移エラー（現在の状態では実行できない操作）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: "INVALID_STATE"
            message: "申請の状態が不正です。DRAFT状態の申請のみ申請できます。現在の状態: SUBMITTED"
            timestamp: "2026-01-01T00:00:00Z"
            path: "/api/requests/1/submit"

    InternalServerError:
      description: サーバー内部エラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: "INTERNAL_SERVER_ERROR"
            message: "予期しないエラーが発生しました"
            timestamp: "2026-01-01T00:00:00Z"
            path: "/api/requests"

  schemas:
    # --- リクエストボディ ---

    RequestCreateBody:
      type: object
      required: [title, requesterId]
      properties:
        title:
          type: string
          description: 申請タイトル
          example: "経費精算申請"
        requesterId:
          type: integer
          format: int64
          description: 申請者のユーザー ID
          example: 1

    SubmitRequestBody:
      type: object
      required: [actorId]
      properties:
        actorId:
          type: integer
          format: int64
          description: 操作者（申請者本人）のユーザー ID
          example: 1

    ApproveRequestBody:
      type: object
      required: [approverId]
      properties:
        approverId:
          type: integer
          format: int64
          description: 承認者のユーザー ID（APPROVER ロール必須）
          example: 2
        comment:
          type: string
          description: 承認コメント（任意）
          nullable: true
          example: "承認します"

    RejectRequestBody:
      type: object
      required: [approverId]
      properties:
        approverId:
          type: integer
          format: int64
          description: 却下者のユーザー ID（APPROVER ロール必須）
          example: 2
        comment:
          type: string
          description: 却下コメント（任意）
          nullable: true
          example: "内容に不備があります"

    # --- レスポンス ---

    RequestResponse:
      type: object
      description: 申請レスポンス（現在の実装では id と status のみ）
      required: [id, status]
      properties:
        id:
          type: integer
          format: int64
          description: 申請 ID
          example: 1
        status:
          $ref: "#/components/schemas/RequestStatus"

    ErrorResponse:
      type: object
      description: エラーレスポンス
      required: [code, message, timestamp, path]
      properties:
        code:
          type: string
          description: エラーコード
          example: "NOT_FOUND"
        message:
          type: string
          description: エラーメッセージ
          example: "申請が見つかりません"
        timestamp:
          type: string
          format: date-time
          description: エラー発生日時（ISO 8601）
          example: "2026-01-01T00:00:00Z"
        path:
          type: string
          description: リクエストパス
          example: "/api/requests/1"

    # --- enum ---

    RequestStatus:
      type: string
      description: |
        申請の状態。
        - DRAFT: 下書き
        - SUBMITTED: 提出済み
        - APPROVED: 承認済み
        - REJECTED: 却下
      enum: [DRAFT, SUBMITTED, APPROVED, REJECTED]

    UserRole:
      type: string
      description: |
        ユーザーロール。
        - ADMIN: 管理者
        - APPROVER: 承認者
        - REQUESTER: 申請者
      enum: [ADMIN, APPROVER, REQUESTER]

    ApprovalAction:
      type: string
      description: |
        承認アクション。
        - APPROVE: 承認
        - REJECT: 却下
      enum: [APPROVE, REJECT]

    HistoryEvent:
      type: string
      description: |
        履歴イベント。
        - SUBMIT: 申請提出
        - APPROVE: 承認
        - REJECT: 却下
      enum: [SUBMIT, APPROVE, REJECT]

    # --- ドメインモデル（参考） ---

    Request:
      type: object
      description: 申請エンティティ（DB モデル。API レスポンスでは RequestResponse を使用）
      required: [id, title, status, requesterId, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        status:
          $ref: "#/components/schemas/RequestStatus"
        requesterId:
          type: integer
          format: int64
          description: 申請者のユーザー ID（FK: users.id）
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Approval:
      type: object
      description: 承認/却下エンティティ
      required: [id, requestId, approverId, action, createdAt]
      properties:
        id:
          type: integer
          format: int64
        requestId:
          type: integer
          format: int64
          description: 申請 ID（FK: requests.id）
        approverId:
          type: integer
          format: int64
          description: 承認者のユーザー ID（FK: users.id）
        action:
          $ref: "#/components/schemas/ApprovalAction"
        comment:
          type: string
          nullable: true
          maxLength: 1000
        createdAt:
          type: string
          format: date-time

    RequestHistory:
      type: object
      description: 操作履歴エンティティ
      required: [id, requestId, actorId, event, createdAt]
      properties:
        id:
          type: integer
          format: int64
        requestId:
          type: integer
          format: int64
          description: 申請 ID（FK: requests.id）
        actorId:
          type: integer
          format: int64
          description: 操作者のユーザー ID（FK: users.id）
        event:
          $ref: "#/components/schemas/HistoryEvent"
        message:
          type: string
          nullable: true
          maxLength: 1000
          description: 操作メッセージ
        createdAt:
          type: string
          format: date-time
